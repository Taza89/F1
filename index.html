<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>F1 Manager - Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f1015;
            --card-bg: #181a20;
            --accent-red: #e10600;
            --accent-hover: #ff1801;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #2a2e39;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #1a1d24 0%, #0f1015 100%);
        }

        /* Topmenu */
        .navbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-red);
            letter-spacing: 1px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: #222630;
        }

        .tab-btn.active {
            color: var(--text-main);
            background: var(--accent-red);
        }

        /* Højre hjørne logo / profil */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .team-badge {
            background: #111318;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-badge span {
            color: var(--accent-red);
        }

        /* Container & Indhold */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
            color: var(--text-main);
            border-bottom: 2px solid var(--accent-red);
            padding-bottom: 10px;
            display: inline-block;
        }

        h3 {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #111318;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-red);
        }

        button.action-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-red);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            margin-top: 5px;
        }

        button.action-btn:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: #2a2e39;
            margin-top: 15px;
            width: auto;
            padding: 8px 16px;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: #3b4252;
        }

        .hidden {
            display: none !important;
        }

        .success, .error {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .success { background: rgba(76, 175, 80, 0.1); border: 1px solid #4CAF50; color: #4CAF50; }
        .error { background: rgba(244, 67, 54, 0.1); border: 1px solid #f44336; color: #f44336; }

        /* Dashboard Grid & Cards */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stats-box, .driver-card {
            background: #111318;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .stats-box p, .driver-card p {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid #1a1d24;
            padding-bottom: 6px;
        }

        .stats-box p:last-child, .driver-card p:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .stats-box span, .driver-card span {
            color: var(--text-muted);
        }

        .driver-header {
            font-weight: bold;
            color: var(--accent-red);
            font-size: 15px;
            margin-bottom: 10px;
        }

        .auth-container {
            max-width: 400px;
            margin: 80px auto;
        }
    </style>
</head>
<body>

<!-- Topmenu (Vises kun når man er logget ind) -->
<div id="navbar" class="navbar hidden">
    <div class="nav-left">
        <div class="nav-logo">🏎️ F1 MANAGER</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('dashboard', this)">Min Bil / Hold</button>
            <button class="tab-btn" onclick="switchTab('drivers', this)">Kørere</button>
            <button class="tab-btn" onclick="switchTab('race', this)">🏁 Løb</button>
        </div>
    </div>
    <div class="nav-right">
        <div class="team-badge">
            <span id="nav-team-name">Holdnavn</span>
        </div>
        <button class="btn-secondary" onclick="logout()" style="margin:0;">Log ud</button>
    </div>
</div>

<div class="container">
    <!-- Login & Oprettelse Del -->
    <div id="auth-section" class="card auth-container">
        <h2>F1 Manager</h2>
        <div id="msg" style="display: none;"></div>

        <div style="margin-top: 20px;">
            <h3>Opret Hold</h3>
            <div class="input-group">
                <label>Brugernavn</label>
                <input type="text" id="reg-user" placeholder="Vælg brugernavn">
            </div>
            <div class="input-group">
                <label>Adgangskode</label>
                <input type="password" id="reg-pass" placeholder="Vælg adgangskode">
            </div>
            <div class="input-group">
                <label>F1 Holdnavn</label>
                <input type="text" id="reg-team" placeholder="F.eks. MullerF1 Racing">
            </div>
            <button class="action-btn" onclick="registerUser()">Opret og Start</button>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 25px 0;">

        <div>
            <h3>Log ind</h3>
            <div class="input-group">
                <label>Brugernavn</label>
                <input type="text" id="login-user" placeholder="Dit brugernavn">
            </div>
            <div class="input-group">
                <label>Adgangskode</label>
                <input type="password" id="login-pass" placeholder="Din adgangskode">
            </div>
            <button class="action-btn" onclick="loginUser()">Log ind</button>
        </div>
    </div>

    <!-- Dashboard Del (Fane 1: Min Bil / Hold) -->
    <div id="tab-dashboard" class="card tab-content hidden">
        <h2>Holdets Fabrik & Bil</h2>
        <div class="grid-2" style="margin-top: 20px;">
            <div>
                <h3>Generelt</h3>
                <div class="stats-box" id="team-info">
                    Henter holddata...
                </div>
            </div>
            <div>
                <h3>Bil Specifikationer</h3>
                <div class="stats-box" id="car-stats">
                    Henter bil-data...
                </div>
            </div>
        </div>
    </div>

    <!-- Kørere Del (Fane 2: Kørere) -->
    <div id="tab-drivers" class="card tab-content hidden">
        <h2>Holdets Kørere</h2>
        <div style="margin-top: 20px;" id="drivers-list">
            Henter kørere...
        </div>
    </div>

    <!-- Løb Del (Fane 3: Dagens Grand Prix) -->
    <div id="tab-race" class="card tab-content hidden">
        <h2>Dagens Grand Prix</h2>

        <div class="stats-box" id="today-track-box" style="margin-bottom: 20px;">
            Henter dagens bane...
        </div>

        <button class="action-btn" onclick="runRace()" style="margin-bottom: 20px;">Kør Dagens Løb 🏎️</button>

        <div id="race-results" class="hidden">
            <h3>Løbsresultat</h3>
            <div id="race-summary" style="margin-bottom: 15px; font-weight: bold; color: var(--accent-red);"></div>
            <div id="race-grid-list"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api';

    function showMessage(text, type) {
        const msg = document.getElementById('msg');
        msg.style.display = 'block';
        msg.className = type;
        msg.innerText = text;
    }

    function switchTab(tabName, btnElement) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        document.getElementById(`tab-${tabName}`).classList.remove('hidden');
        btnElement.classList.add('active');

        if (tabName === 'race') {
            loadTodayTrack();
        }
    }

    async function registerUser() {
        const username = document.getElementById('reg-user').value.trim();
        const password = document.getElementById('reg-pass').value.trim();
        const teamName = document.getElementById('reg-team').value.trim();

        if (!username || !password || !teamName) {
            showMessage("Udfyld venligst alle felter.", "error");
            return;
        }

        try {
            const response = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, teamName })
            });
            const data = await response.json();

            if (response.ok) {
                showMessage("Hold oprettet succesfuldt! Logger ind...", "success");
                document.getElementById('login-user').value = username;
                document.getElementById('login-pass').value = password;
                await loginUser();
            } else {
                showMessage(data.error, "error");
            }
        } catch (err) {
            showMessage("Kunne ikke oprette forbindelse til serveren.", "error");
        }
    }

    async function loginUser() {
        const username = document.getElementById('login-user').value.trim();
        const password = document.getElementById('login-pass').value.trim();

        if (!username || !password) {
            showMessage("Udfyld både brugernavn og adgangskode.", "error");
            return;
        }

        try {
            const response = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('token', data.token);
                await loadDashboard();
            } else {
                showMessage(data.error, "error");
            }
        } catch (err) {
            showMessage("Kunne ikke logge ind.", "error");
        }
    }

    async function loadDashboard() {
        const token = localStorage.getItem('token');
        if (!token) return;

        try {
            const responseTeam = await fetch(`${API_URL}/my-team`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const teamData = await responseTeam.json();

            const responseDrivers = await fetch(`${API_URL}/my-drivers`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const driversData = await responseDrivers.json();

            if (responseTeam.ok && responseDrivers.ok) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('navbar').classList.remove('hidden');
                document.getElementById('tab-dashboard').classList.remove('hidden');

                const team = teamData.team;

                document.getElementById('nav-team-name').innerText = team.team_name;

                document.getElementById('team-info').innerHTML = `
                    <p><span>Holdnavn:</span> <strong>${team.team_name}</strong></p>
                    <p><span>Budget:</span> <strong>${team.budget.toLocaleString('da-DK')} kr.</strong></p>
                `;

                document.getElementById('car-stats').innerHTML = `
                    <p><span>Motor Power:</span> <strong>Level ${team.engine_power}</strong></p>
                    <p><span>Aerodynamik:</span> <strong>Level ${team.aero_level}</strong></p>
                    <p><span>Pålidelighed:</span> <strong>Level ${team.reliability}</strong></p>
                `;

                const driversHtml = driversData.drivers.map(driver => `
                    <div class="driver-card">
                        <div class="driver-header">${driver.role}: ${driver.name}</div>
                        <p><span>Alder:</span> <strong>${driver.age ? driver.age + ' år' : 'N/A'}</strong></p>
                        <p><span>Evne (Skill):</span> <strong>Rating ${driver.skill}</strong></p>
                        <p><span>Løn:</span> <strong>${driver.salary.toLocaleString('da-DK')} kr.</strong></p>
                    </div>
                `).join('');

                document.getElementById('drivers-list').innerHTML = driversHtml;
            }
        } catch (err) {
            console.error("Fejl ved hentning af data", err);
        }
    }

    async function loadTodayTrack() {
        try {
            const response = await fetch(`${API_URL}/today-track`);
            const data = await response.json();
            const track = data.track;

            let focusText = "";
            if (track.statFocus === 'engine') focusText = "⚡ Høj Topfart (Motor)";
            if (track.statFocus === 'aero') focusText = "🌀 Svære Sving (Aerodynamik)";
            if (track.statFocus === 'reliability') focusText = "🛡️ Krævende Bane (Pålidelighed)";

            document.getElementById('today-track-box').innerHTML = `
                <p><span>Dagens Bane (Dag ${data.dayOfMonth} i måneden):</span> <strong>${track.country} - ${track.name}</strong></p>
                <p><span>Banens primære krav:</span> <strong>${focusText}</strong></p>
            `;
        } catch (err) {
            console.error("Fejl ved hentning af bane", err);
        }
    }

    async function runRace() {
        const token = localStorage.getItem('token');
        if (!token) return;

        try {
            const response = await fetch(`${API_URL}/race`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();

            if (response.ok) {
                document.getElementById('race-results').classList.remove('hidden');
                document.getElementById('race-summary').innerText =
                    `Du sluttede som P${data.position} på ${data.track.name}! Præmie modtaget: ${data.prizeMoney.toLocaleString('da-DK')} kr.`;

                const gridHtml = data.grid.map(item => `
                    <div class="driver-card" style="${item.isUser ? 'border: 2px solid var(--accent-red); background: #1f1b24;' : ''}">
                        <p><span>P${item.position}:</span> <strong>${item.team} ${item.isUser ? '(DIT HOLD)' : ''}</strong></p>
                    </div>
                `).join('');

                document.getElementById('race-grid-list').innerHTML = gridHtml;

                // Opdater budgettet på dashboardet
                loadDashboard();
            } else {
                // Hvis man allerede har kørt i dag
                alert(data.error);
            }
        } catch (err) {
            console.error("Fejl ved afvikling af løb", err);
        }
    }

    function logout() {
        localStorage.removeItem('token');
        document.getElementById('navbar').classList.add('hidden');
        document.getElementById('tab-dashboard').classList.add('hidden');
        document.getElementById('tab-drivers').classList.add('hidden');
        document.getElementById('tab-race').classList.add('hidden');
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('msg').style.display = 'none';
    }

    window.onload = () => {
        if (localStorage.getItem('token')) {
            loadDashboard();
        }
    };
</script>
</body>
</html>
